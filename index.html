<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Urgencias · Test</title>
  <style>
    :root {
      --bg: #f3f7f6;
      --card: #ffffff;
      --text: #17211f;
      --muted: #66736f;
      --primary: #0f766e;
      --primary-dark: #0a5a54;
      --border: #dce6e3;
      --ok-bg: #ecfdf5;
      --ok: #047857;
      --bad-bg: #fff1f2;
      --bad: #be123c;
      --shadow: 0 12px 32px rgba(17, 42, 37, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #edf7f5 0%, var(--bg) 38%, var(--bg) 100%);
      color: var(--text);
    }

    .shell {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 30px 0 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: white;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .brand h1 { margin: 0; font-size: 1.16rem; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }

    .card {
      background: var(--card);
      border: 1px solid rgba(220,230,227,.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 34px);
    }

    .hidden { display: none !important; }

    h2 { margin-top: 0; font-size: clamp(1.45rem, 4vw, 2rem); }
    p { line-height: 1.55; }

    label { display: block; font-weight: 700; margin: 18px 0 8px; }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
      outline: none;
      text-transform: uppercase;
    }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15,118,110,.1); }

    button {
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 14px;
      padding: 14px 18px;
      color: #fff;
      background: var(--primary);
    }

    .primary:hover:not(:disabled) { background: var(--primary-dark); }
    .primary:disabled { opacity: .65; cursor: wait; }

    .error {
      color: var(--bad);
      min-height: 1.3em;
      font-size: .92rem;
      margin: 10px 0 0;
    }

    .demo-note {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 13px;
      background: #f8faf9;
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: .86rem;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e7f5f2;
      color: var(--primary-dark);
      font-weight: 800;
      font-size: .78rem;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #e8efed;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--primary);
      transition: width .25s ease;
    }

    .question {
      font-size: clamp(1.2rem, 3.5vw, 1.55rem);
      line-height: 1.42;
      font-weight: 800;
      margin: 10px 0 22px;
    }

    .options { display: grid; gap: 11px; }

    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      padding: 14px 15px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 650;
      line-height: 1.4;
    }

    .option:hover:not(:disabled) { border-color: #97bcb6; background: #f7fbfa; }
    .option:disabled { cursor: default; opacity: 1; }

    .letter {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #edf3f1;
      font-weight: 900;
    }

    .option.correct { border-color: #6ee7b7; background: var(--ok-bg); }
    .option.correct .letter { background: #d1fae5; color: var(--ok); }
    .option.incorrect { border-color: #fda4af; background: var(--bad-bg); }
    .option.incorrect .letter { background: #ffe4e6; color: var(--bad); }

    .feedback {
      margin-top: 20px;
      border-radius: 16px;
      padding: 17px;
      border: 1px solid var(--border);
    }

    .feedback.ok { background: var(--ok-bg); border-color: #a7f3d0; }
    .feedback.bad { background: var(--bad-bg); border-color: #fecdd3; }
    .feedback-title { font-size: 1.05rem; font-weight: 900; margin-bottom: 8px; }
    .feedback p { margin: 8px 0 0; }

    .next {
      width: 100%;
      margin-top: 18px;
      padding: 14px 18px;
      color: #fff;
      background: #17211f;
    }

    .result-number {
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      font-weight: 950;
      line-height: 1;
      margin: 16px 0 8px;
      color: var(--primary);
    }

    .small { color: var(--muted); font-size: .9rem; }

    @media (max-width: 520px) {
      .shell { width: min(100% - 18px, 760px); padding-top: 16px; }
      .card { border-radius: 18px; padding: 19px; }
      .brand { margin-bottom: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="logo">UE</div>
      <div>
        <h1>Urgencias · Test</h1>
        <p>Test de urgencias · preguntas y corrección desde Supabase</p>
      </div>
    </div>

    <section id="loginCard" class="card">
      <span class="tag">ACCESO PRIVADO</span>
      <h2 style="margin-top:14px">Introduce tu código</h2>
      <p class="small">Introduce el código privado que te han facilitado para acceder.</p>
      <form id="loginForm">
        <label for="accessCode">Código de acceso</label>
        <input id="accessCode" autocomplete="off" placeholder="Introduce tu código" />
        <button class="primary" type="submit">Entrar</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <section id="quizCard" class="card hidden">
      <div class="topline">
        <span id="category" class="tag"></span>
        <span id="progressText"></span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <div id="question" class="question"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="nextBtn" class="next hidden" type="button">Siguiente pregunta</button>
    </section>

    <section id="resultCard" class="card hidden">
      <span class="tag">TEST COMPLETADO</span>
      <h2 style="margin-top:14px">Resultado</h2>
      <div id="resultNumber" class="result-number"></div>
      <p id="resultText"></p>
      <button id="restartBtn" class="primary" type="button">Hacer otro test</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://bqxysomokzwlpkkxybny.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SJy9aIyYjn4dvr_h1S7GLw_mxDxGfoz";

    async function rpc(nombre, payload) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nombre}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_PUBLISHABLE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`${nombre}: ${response.status} ${detail}`);
      }
      return await response.json();
    }

    const loginCard = document.getElementById('loginCard');
    const quizCard = document.getElementById('quizCard');
    const resultCard = document.getElementById('resultCard');
    const loginForm = document.getElementById('loginForm');
    const accessCode = document.getElementById('accessCode');
    const loginError = document.getElementById('loginError');
    const categoryEl = document.getElementById('category');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultNumber = document.getElementById('resultNumber');
    const resultText = document.getElementById('resultText');

    let currentAccessCode = '';
    let test = [];
    let current = 0;
    let score = 0;
    let scoredAnswered = 0;
    let annulled = 0;
    let answered = false;

    async function validarCodigo(code) {
      return await rpc('validar_codigo', { input_code: code });
    }

    async function cargarPreguntas() {
      const rows = await rpc('obtener_preguntas', {
        input_code: currentAccessCode,
        cantidad: 20,
        filtro_seccion: null
      });
      return Array.isArray(rows) ? rows : [];
    }

    async function corregirPregunta(id, respuesta) {
      const rows = await rpc('corregir_pregunta', {
        input_code: currentAccessCode,
        pregunta_id: id,
        respuesta_usuario: respuesta
      });
      return Array.isArray(rows) ? rows[0] : rows;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = accessCode.value.trim().toUpperCase();
      const submitBtn = loginForm.querySelector('button[type="submit"]');

      if (!code) {
        loginError.textContent = 'Introduce un código de acceso.';
        return;
      }

      loginError.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Comprobando…';

      try {
        const valido = await validarCodigo(code);
        if (!valido) {
          loginError.textContent = 'Código no válido, caducado o desactivado.';
          return;
        }
        currentAccessCode = code;
        loginCard.classList.add('hidden');
        await startTest();
      } catch (error) {
        console.error(error);
        loginError.textContent = 'No se ha podido conectar con el test. Inténtalo de nuevo.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });

    async function startTest() {
      quizCard.classList.remove('hidden');
      resultCard.classList.add('hidden');
      questionEl.textContent = 'Cargando preguntas…';
      optionsEl.innerHTML = '';
      feedbackEl.className = 'feedback hidden';
      nextBtn.classList.add('hidden');

      try {
        test = await cargarPreguntas();
        if (!test.length) {
          questionEl.textContent = 'No hay preguntas disponibles todavía.';
          return;
        }
        current = 0;
        score = 0;
        scoredAnswered = 0;
        annulled = 0;
        answered = false;
        renderQuestion();
      } catch (error) {
        console.error(error);
        questionEl.textContent = 'No se han podido cargar las preguntas desde Supabase.';
      }
    }

    function renderQuestion() {
      answered = false;
      const q = test[current];
      categoryEl.textContent = q.tema || q.seccion || 'Urgencias';
      progressText.textContent = `Pregunta ${current + 1} de ${test.length}`;
      progressBar.style.width = `${((current + 1) / test.length) * 100}%`;
      questionEl.textContent = q.enunciado;
      feedbackEl.className = 'feedback hidden';
      feedbackEl.innerHTML = '';
      nextBtn.classList.add('hidden');
      nextBtn.textContent = current === test.length - 1 ? 'Ver resultado' : 'Siguiente pregunta';

      const options = [q.opcion_a, q.opcion_b, q.opcion_c, q.opcion_d];
      optionsEl.innerHTML = '';
      options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.dataset.letter = ['a','b','c','d'][index];
        btn.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${option}</span>`;
        btn.addEventListener('click', () => answer(index));
        optionsEl.appendChild(btn);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function answer(selectedIndex) {
      if (answered) return;
      answered = true;
      const q = test[current];
      const buttons = [...optionsEl.querySelectorAll('.option')];
      buttons.forEach(btn => btn.disabled = true);

      const selectedLetter = ['a','b','c','d'][selectedIndex];
      feedbackEl.className = 'feedback';
      feedbackEl.innerHTML = '<div class="feedback-title">Comprobando respuesta…</div>';
      feedbackEl.classList.remove('hidden');

      try {
        const r = await corregirPregunta(q.id, selectedLetter);
        if (!r) throw new Error('Sin respuesta de corrección');

        const correctIndex = r.respuesta_correcta ? ['a','b','c','d'].indexOf(r.respuesta_correcta.toLowerCase()) : -1;
        if (correctIndex >= 0) buttons[correctIndex].classList.add('correct');

        if (r.puntua) {
          scoredAnswered++;
          if (r.es_correcta) score++;
          else buttons[selectedIndex].classList.add('incorrect');
        } else {
          annulled++;
        }

        feedbackEl.classList.add(r.puntua ? (r.es_correcta ? 'ok' : 'bad') : 'bad');

        let html = '';
        if (!r.puntua) {
          html += `<div class="feedback-title">⚠️ Pregunta desactualizada · no puntúa</div>`;
        } else {
          html += `<div class="feedback-title">${r.es_correcta ? '✅ Correcta' : '❌ Incorrecta'}</div>`;
        }

        if (r.respuesta_libro) {
          const libroIdx = ['a','b','c','d'].indexOf(r.respuesta_libro.toLowerCase());
          const options = [q.opcion_a, q.opcion_b, q.opcion_c, q.opcion_d];
          html += `<p><strong>Respuesta del libro: ${r.respuesta_libro.toUpperCase()}.</strong>${libroIdx >= 0 ? ' ' + options[libroIdx] : ''}</p>`;
        }

        if (r.explicacion_libro) {
          html += `<p>${r.explicacion_libro}</p>`;
        }

        if ((r.estado_revision === 'actualizada' || r.estado_revision === 'desactualizada') && r.explicacion_actual) {
          html += `<div style="margin-top:14px;padding:14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa">`;
          html += `<strong>⚠️ Actualización médica</strong>`;
          html += `<p>${r.explicacion_actual}</p>`;
          if (r.fuente_actual) html += `<p class="small"><strong>Fuente:</strong> ${r.fuente_actual}${r.fecha_revision ? ` · Revisado ${r.fecha_revision}` : ''}</p>`;
          if (r.url_fuente) html += `<p class="small"><a href="${r.url_fuente}" target="_blank" rel="noopener noreferrer">Ver fuente actual</a></p>`;
          html += `</div>`;
        }

        feedbackEl.innerHTML = html;
        nextBtn.classList.remove('hidden');
      } catch (error) {
        console.error(error);
        answered = false;
        buttons.forEach(btn => btn.disabled = false);
        feedbackEl.className = 'feedback bad';
        feedbackEl.innerHTML = '<div class="feedback-title">No se ha podido corregir la pregunta.</div><p>Inténtalo otra vez.</p>';
      }
    }

    nextBtn.addEventListener('click', () => {
      if (!answered) return;
      if (current < test.length - 1) {
        current++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      quizCard.classList.add('hidden');
      resultCard.classList.remove('hidden');
      const pct = scoredAnswered ? Math.round((score / scoredAnswered) * 100) : 0;
      resultNumber.textContent = `${score}/${scoredAnswered}`;
      resultText.textContent = `Has obtenido un ${pct}% en las preguntas puntuables.${annulled ? ` ${annulled} pregunta(s) desactualizada(s) no se han contabilizado.` : ''}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    restartBtn.addEventListener('click', startTest);
  </script>
</body>
</html>
